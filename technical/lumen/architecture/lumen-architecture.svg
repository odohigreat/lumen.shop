<rect width="1280" height="950" fill="#f8fafc"/>
<text x="40" y="29" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#0f172a">LUMEN · Client-rendered frontend architecture</text>
<path d="M630 123 V175" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M910 217 H810" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
