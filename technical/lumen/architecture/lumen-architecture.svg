<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title desc">
<title id="title">LUMEN frontend architecture</title><desc id="desc">Vercel serves a React and Vite SPA. Router and typed local catalog feed variant selection and Zustand cart. Guarded localStorage persistence reconciles cart records. UI state opens local checkout validated with Zod. Remote images are assets; no commerce backend is connected.</desc>
